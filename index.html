<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Attendance Management</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#1f2430;--pri:#3b5bdb;--bad:#e03131;--ok:#2f9e44;--line:#dde1ea}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--pri);color:#fff;padding:14px 24px;font-size:1.2rem;font-weight:600}
nav{display:flex;gap:6px;padding:12px 24px;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:var(--card);padding:8px 16px;border-radius:6px;cursor:pointer}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{padding:0 24px 40px;max-width:1000px;margin:auto}
section{display:none;background:var(--card);padding:20px;border-radius:8px;border:1px solid var(--line)}section.on{display:block}
input,select,button.a{padding:8px;border:1px solid var(--line);border-radius:6px;margin:3px}
button.a{background:var(--pri);color:#fff;cursor:pointer}button.d{background:var(--bad);color:#fff;border:0;border-radius:4px;padding:4px 8px;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.low{color:var(--bad);font-weight:600}.good{color:var(--ok);font-weight:600}#msg{padding:8px 24px;color:var(--bad)}
</style></head><body>
<header>Student Attendance Management System</header>
<nav id="tabs"></nav><div id="msg"></div>
<main>
<section id="students">
  <input id="sRoll" placeholder="Roll no"><input id="sName" placeholder="Name"><input id="sEmail" placeholder="Email"><input id="sCourse" placeholder="Course">
  <button class="a" id="sSave" onclick="saveStudent()">Add student</button><button class="a" onclick="resetStudent()">Clear</button><br>
  <input id="sSearch" placeholder="Search roll / name / course" oninput="loadStudents()">
  <table><thead><tr><th>Roll</th><th>Name</th><th>Email</th><th>Course</th><th></th></tr></thead><tbody id="sBody"></tbody></table>
</section>
<section id="subjects">
  <input id="subCode" placeholder="Code"><input id="subName" placeholder="Subject name"><button class="a" onclick="addSubject()">Add subject</button>
  <table><thead><tr><th>Code</th><th>Name</th><th></th></tr></thead><tbody id="subBody"></tbody></table>
</section>
<section id="mark">
  <select id="mSub"></select><input type="date" id="mDate"><button class="a" onclick="loadMark()">Load students</button>
  <table><thead><tr><th>Roll</th><th>Name</th><th>Present</th><th>Absent</th></tr></thead><tbody id="mBody"></tbody></table>
  <button class="a" onclick="saveMark()">Save attendance</button>
</section>
<section id="report">
  <select id="rStu"></select><button class="a" onclick="studentReport()">Subject-wise report</button>
  <table><thead><tr><th>Subject</th><th>Held</th><th>Present</th><th>%</th></tr></thead><tbody id="rBody"></tbody></table>
</section>
<section id="low">
  Below <input type="number" id="lTh" value="75" style="width:70px">% in
  <select id="lSub"></select><button class="a" onclick="loadLow()">Show</button>
  <table><thead><tr><th>Roll</th><th>Name</th><th>Scope</th><th>Held</th><th>Present</th><th>%</th></tr></thead><tbody id="lBody"></tbody></table>
</section>
</main>
<script src="app.js"></script></body></html>
